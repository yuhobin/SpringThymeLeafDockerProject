name: Deploy Git Action
# 언제부터 배포를 시작 = master에서 push할때마다 배포
on: 
  push:
    branches:
      - master

# 작업 지시
jobs:
  deploy:
    runs-on: self-hosted # 현재 Ubuntu에 배포
    
    # 어떤 순서로 진행할지
    steps:
      # 1. 소스 코드 다운로드 = clone
      - uses: actions/checkout@v4
      
      # 2. JDK 21버전인지 확인
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      # 3. gradlew 권한 부여
      - run: chmod +x gradlew
      
      # 4. 빌드 
      - run: ./gradlew clean build -x test
      
      # 5. 기존 실행 중인 프로세스 종료
      
      - run: |
          PID=$(lsof -t -i:8080 || true)
          if [ -n "$PID" ]; then
            kill -15 "$PID" || true
            sleep 5
          fi
        
          
      # 6. 실행 => jar파일 생성 => 백그라운드 실행
      - run: nohup java -jar build/libs/SpringThymeLeafDockerProject-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
        env:
          RUNNER_TRACKING_ID: ""
        
