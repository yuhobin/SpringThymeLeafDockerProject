name: Deploy Git Action
# 언제부터 배포를 시작 = master에서 push할때마다 배포
on: 
  push:
    branches:
      - master
# 작업 지시
jobs:
  deploy:
    runs-on: self-hosted #현재 Ububtu에 배포
    # 어떤 순서로 진행할지
    steps:
      # 소스 코드 다운로드 = clone
      - uses: actions/checkout@v4
      # JDK 21버전인지 확인
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # gradlew 권한 부여
      - run: chmod +x gradlew
      # 빌드
      - run: ./gradlew clean build -x text
      # 실행 => jar파일 생성 => java -jar app.jar
      - run: |
          PID=$(lsof -t -i:8080)
          [-n "$PID" ] && kill -15 $PID || true
      - run: nohup java -jar build/libs/*.0.0.1-SNAPSHOT.jar > app.log2>&1 &
