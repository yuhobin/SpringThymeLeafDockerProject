#port => default: 8080
#spring => 데이터베이스 세팅 (datasource)
server: 
  servlet: 
    context-path: /
spring:
  servlet: 
    multipart: 
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: hr
    password: happy
    driver-class-name: oracle.jdbc.driver.OracleDriver
#       => jpa / thymeleaf 세팅
# 각 데이터베이스의 맞는 SQL문법 생성
# JPA => Hibernate => SQL 문장 생성 => Oracle DB 실행
# SELECT NVL(Max(no)+1, 1) FROM board   => 오라클
# SELECT IFNULL(Max(no)+1, 1) FROM board  => MySQL
# OFFSET => LIMIT
# SYSDATE => Oracle, NOW() => MySQL, CURRENT_DATE => PostgresSQL 문법이 좀 다르다
# 추가 => web => upload
  jpa:
    database: oracle
    properties:
      hibernate:  
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        user_sql_comments: true
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML
file:
  upload_dir: C:/upload
# mybatis
mybatis:
  type-aliases-package: com.sist.web.vo
  mapper-locations: mybatis/mapper/*.xml
# logging
logging: 
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
# security
